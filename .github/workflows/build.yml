name: Build

# Builds Tyrian2000Plus for Windows, Linux (Steam Deck) and web browsers on
# every push.
# The packages are on the run's page under "Artifacts".  Publishing a GitHub
# release also attaches them to the release.  Only the release packages carry
# the freeware game data (unchanged, see add_game_data.sh); the per-push
# builds stay without it.  With the BUTLER_API_KEY secret set, a release is
# also sent to the itch.io page (itch_push.sh) and gets a Windows installer
# (make_installer.sh) and the Steam Deck installer script.
#
# The build jobs download tools from outside (compiler, SDL, butler), so they
# only get read access to the repository.  Only the small "release" job, which
# runs nothing downloaded, may write: it attaches the packages and a
# SHA256SUMS file to the release.  Third-party actions are pinned by commit.

on:
  push:
    # Pushes to other branches are built by their pull request (one build
    # per change, not two).
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 (Steam Deck)
    # 22.04 on purpose: the binary needs a glibc no newer than the one it was
    # built against, so building on the oldest supported runner is what lets
    # it run on more machines.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # git describe --tags for the version string
          persist-credentials: false
      - name: Install dependencies
        # The distro libsdl2-dev is only for the -Werror compile check.  The
        # release links a static SDL2 built from source
        # (make_linux.sh), so the -dev packages after it are HEADERS for SDL's
        # dlopen'ed backends - nothing from them is linked into the binary.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config curl libsdl2-dev libsdl2-net-dev \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libgbm-dev libdrm-dev libdbus-1-dev libudev-dev \
            wayland-protocols libpipewire-0.3-dev
      - name: Compile check (debug, -Werror, distro SDL2)
        run: |
          make -j"$(nproc)" debug
          make clean
      - name: Cache static SDL2 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/sdl
          key: sdl2-static-x86_64-${{ hashFiles('make_linux.sh') }}
      - name: Build and package (make_linux.sh, static SDL2)
        run: ./make_linux.sh
      - name: Tests (against the static SDL2)
        run: tests/run_tests.sh
      - name: Verify the package is self-contained
        # In a bare Debian container: no SDL, no libdecor, nothing installed.
        # The runner itself proves nothing here - it has all of those, and a
        # missing dependency would be silently satisfied.
        run: |
          mkdir -p pkgtest
          tar -xzf dist/Tyrian2000Plus-linux-x86_64.tar.gz -C pkgtest
          docker run --rm -v "$PWD/pkgtest:/pkg:ro" -w / debian:bookworm-slim \
            /pkg/Tyrian2000Plus-linux-x86_64/Tyrian2000Plus --help
      # The .tar.gz keeps the binary's executable permission, which a plain
      # artifact zip would lose.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Tyrian2000Plus-linux-x86_64
          path: dist/Tyrian2000Plus-linux-x86_64.tar.gz
      # Release only: add the game data and the Deck updater, send that to
      # itch.io and hand the package to the "release" job.
      - name: Add the game data and the updater (release)
        if: github.event_name == 'release'
        run: |
          ./add_game_data.sh dist/Tyrian2000Plus-linux-x86_64
          cp linux/atualizar-tyrian.sh dist/Tyrian2000Plus-linux-x86_64/
          chmod +x dist/Tyrian2000Plus-linux-x86_64/atualizar-tyrian.sh
      - name: Send to itch.io
        # Skipped (with a note in the log) while the BUTLER_API_KEY secret is
        # not set.
        if: github.event_name == 'release'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: ./itch_push.sh dist/Tyrian2000Plus-linux-x86_64 linux "$TAG"
      - name: Release package
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release
          tar -czf "release/Tyrian2000Plus-$TAG-linux-x86_64.tar.gz" -C dist Tyrian2000Plus-linux-x86_64
          # The same updater on its own: the one file to download for a
          # first install on the Steam Deck.
          cp linux/atualizar-tyrian.sh "release/Tyrian2000Plus-$TAG-instalar-steam-deck.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'release'
        with:
          name: release-linux
          path: release/

  windows:
    name: Windows x64
    # Cross-compiled with llvm-mingw, the same way as the local builds.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make curl xz-utils zip unzip python3 nsis
      - name: Cache toolchain and SDL2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/win
          key: win-x64-${{ hashFiles('make_windows.sh') }}
      - name: Build and package (make_windows.sh)
        run: ./make_windows.sh
      # Uploading the folder makes the artifact zip hold the files directly.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Tyrian2000Plus-windows-x64
          path: dist/Tyrian2000Plus-windows-x64/
      - name: Check that the installer builds
        # Without the game data on normal pushes, so it is not uploaded.
        if: github.event_name != 'release'
        run: ./make_installer.sh dist/Tyrian2000Plus-windows-x64 build/installer-check.exe
      - name: Add the game data (release)
        if: github.event_name == 'release'
        run: ./add_game_data.sh dist/Tyrian2000Plus-windows-x64 crlf
      - name: Send to itch.io
        if: github.event_name == 'release'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: ./itch_push.sh dist/Tyrian2000Plus-windows-x64 windows "$TAG"
      - name: Release package
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release
          (cd dist && zip -qr "../release/Tyrian2000Plus-$TAG-windows-x64.zip" Tyrian2000Plus-windows-x64)
          ./make_installer.sh dist/Tyrian2000Plus-windows-x64 "release/Tyrian2000Plus-$TAG-windows-x64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'release'
        with:
          name: release-windows
          path: release/

  web:
    name: Web (browser)
    # The version that plays on the itch.io page (make_web.sh, Emscripten).
    # 24.04 for its newer node, which Emscripten needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache Emscripten and SDL2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/web
          key: web-${{ hashFiles('make_web.sh') }}
      - name: Build (make_web.sh)
        run: ./make_web.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Tyrian2000Plus-web
          path: dist/Tyrian2000Plus-web/
      # Release only: the same build with the game data, sent to the itch.io
      # page, where it plays in the browser.
      - name: Build with the game data (release)
        if: github.event_name == 'release'
        run: ./make_web.sh --with-data
      - name: Send to itch.io
        if: github.event_name == 'release'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: ./itch_push.sh dist/Tyrian2000Plus-web html5 "$TAG"

  release:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write    # upload the release assets
      actions: read      # download this run's artifacts
    steps:
      - name: Attach the packages and SHA256SUMS
        # SHA256SUMS lets anyone (and linux/atualizar-tyrian.sh) check that a
        # downloaded package is exactly the one built here.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release && cd release
          gh run download "$RUN_ID" -n release-linux
          gh run download "$RUN_ID" -n release-windows
          sha256sum Tyrian2000Plus-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" Tyrian2000Plus-* SHA256SUMS --clobber


