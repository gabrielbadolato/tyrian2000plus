<!doctype html>
<!--
  Tyrian 2000+ in the browser: the page around the WebAssembly build
  (see make_web.sh).

  Copyright (C) 2026 Tyrian 2000+ contributors
  GNU General Public License version 2 or later (licencas/GPL-2.0.txt).

  What the page does, before the game starts:
  - keeps the game's user folder (settings, saves, statistics) in the
    browser's IndexedDB, loaded before the game and written back a moment
    after the game closes a file, every few seconds, when the tab is hidden
    and when the game quits;
  - loads the game data (data/tyrian2000.tar) into the folder the game
    looks for it in (/data, next to the "executable");
  - waits for a click or a key: browsers only allow sound after one;
  - takes tyrian.sav (the saved games) to and from the computer, from the
    first screen or from the game's Setup > Saved Games (window.tyrianSaves).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyrian 2000+</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #000; --fg: #e8d9a8; --dim: #9a8c66; --accent: #f0b53c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none;
    image-rendering: pixelated; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: var(--bg);
    text-align: center; padding: 16px; box-sizing: border-box; cursor: default; }
  #overlay.ready { cursor: pointer; }
  #overlay img { width: 96px; height: 96px; image-rendering: pixelated; }
  #overlay h1 { margin: 0; font-size: 28px; letter-spacing: 1px; color: var(--accent); }
  #status { min-height: 1.4em; color: var(--dim); }
  #play { display: none; font: inherit; font-size: 20px; padding: 10px 28px;
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    border-radius: 6px; cursor: pointer; }
  #overlay.ready #play { display: inline-block; }
  #play:hover, #play:focus-visible { background: var(--accent); color: var(--bg); outline: none; }
  #hint { max-width: 34em; font-size: 14px; color: var(--dim); }
  #hint a { color: var(--fg); }
  #full { position: fixed; top: 8px; right: 8px; display: none; font: inherit; font-size: 13px;
    padding: 4px 10px; border: 1px solid var(--dim); background: rgba(0,0,0,.6);
    color: var(--fg); border-radius: 4px; cursor: pointer; opacity: .35; }
  #full:hover { opacity: 1; }
  body.playing #full { display: block; }
  body.playing:fullscreen #full, body.playing:has(:fullscreen) #full { display: none; }
  /* no page scrolling or zooming while playing by touch */
  #canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #savesLink { display: none; font: inherit; font-size: 14px; background: none; border: none;
    color: var(--fg); text-decoration: underline; cursor: pointer; padding: 4px; }
  #overlay.ready #savesLink { display: inline-block; }
  #saves { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.75); padding: 16px; box-sizing: border-box; z-index: 10; }
  #saves.open { display: flex; }
  #saves .box { max-width: 30em; width: 100%; max-height: 100%; overflow: auto; box-sizing: border-box;
    background: #1c1608; border: 2px solid var(--accent); border-radius: 8px; padding: 18px 20px; }
  #saves h2 { margin: 0 0 8px; font-size: 20px; color: var(--accent); }
  #saves p { margin: 8px 0; font-size: 14px; }
  #saves .small { color: var(--dim); font-size: 13px; }
  #saves .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  #saves button { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 2px solid var(--accent); background: transparent; color: var(--accent); }
  #saves button:hover, #saves button:focus-visible { background: var(--accent); color: var(--bg); outline: none; }
  #savesMsg { min-height: 1.4em; color: var(--accent); }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<button id="full" type="button"></button>
<div id="overlay">
  <img src="icon.png" alt="">
  <h1>Tyrian 2000+</h1>
  <div id="status"></div>
  <button id="play" type="button"></button>
  <div id="hint"></div>
  <button id="savesLink" type="button"></button>
</div>
<div id="saves" role="dialog" aria-modal="true" aria-labelledby="savesTitle">
  <div class="box">
    <h2 id="savesTitle"></h2>
    <p id="savesText"></p>
    <div class="buttons">
      <button id="savesExport" type="button"></button>
      <button id="savesImport" type="button"></button>
      <button id="savesClose" type="button"></button>
    </div>
    <p id="savesMsg" aria-live="polite"></p>
    <p class="small" id="savesHelp"></p>
  </div>
  <input id="savesFile" type="file" hidden>
</div>
<script>
"use strict";
(function () {
  var pt = /^pt/i.test(navigator.language || "");
  var T = pt ? {
    loading: "Carregando...", data: "Carregando os dados do jogo... ",
    saves: "Abrindo os saves...", play: "Jogar",
    hint: "Os saves ficam guardados neste navegador. Tela cheia: botão no canto ou Alt-Enter. " +
          "Controles Xbox e PlayStation funcionam (aperte um botão depois de começar). " +
          "No celular ou tablet, toque na tela para aparecerem os controles.",
    full: "Tela cheia", nodata: "Esta versão não tem os dados do jogo.",
    error: "Não foi possível abrir o jogo: ", closed: "O jogo foi fechado.", again: "Jogar de novo",
    savesLink: "Jogos salvos: levar para o computador ou trazer de lá",
    savesTitle: "Jogos salvos",
    savesText: "Seus jogos salvos e recordes ficam no arquivo tyrian.sav. O mesmo arquivo serve aqui no navegador " +
               "e nas versões para Windows e Linux (Steam Deck).",
    savesExport: "Baixar o tyrian.sav", savesImport: "Carregar um tyrian.sav...", savesClose: "Fechar",
    savesHelp: "No computador: no jogo, Configurações > Jogos salvos... abre a pasta do tyrian.sav. " +
               "Ponha o arquivo baixado lá com o jogo na tela de título (ou fechado). " +
               "Para trazer de lá, carregue aqui o tyrian.sav dessa pasta.",
    savesNone: "Ainda não há jogos salvos neste navegador.",
    savesBad: "Este arquivo não parece um tyrian.sav do Tyrian 2000.",
    savesConfirm: "Trocar os jogos salvos deste navegador pelos deste arquivo? " +
                  "Os atuais ficam guardados como tyrian-antes-de-carregar.sav.",
    savesDone: "Pronto: os jogos salvos foram carregados.", savesRestart: "Pronto. Reabrindo o jogo...",
    savesFailed: "Não deu certo: "
  } : {
    loading: "Loading...", data: "Loading the game data... ",
    saves: "Opening the saves...", play: "Play",
    hint: "Your saves are kept in this browser. Full screen: the button in the corner or Alt-Enter. " +
          "Xbox and PlayStation controllers work (press a button after the game starts). " +
          "On a phone or tablet, touch the screen for the controls.",
    full: "Full screen", nodata: "This build has no game data.",
    error: "The game could not start: ", closed: "The game was closed.", again: "Play again",
    savesLink: "Saved games: take them to a computer or bring them here",
    savesTitle: "Saved games",
    savesText: "Your saved games and high scores are in the file tyrian.sav. The same file works here in the " +
               "browser and in the Windows and Linux (Steam Deck) versions.",
    savesExport: "Download tyrian.sav", savesImport: "Load a tyrian.sav...", savesClose: "Close",
    savesHelp: "On the computer: in the game, Setup > Saved Games... opens the folder of tyrian.sav. " +
               "Put the downloaded file there with the game at the title screen (or closed). " +
               "To bring it here, load the tyrian.sav from that folder.",
    savesNone: "There are no saved games in this browser yet.",
    savesBad: "This file does not look like a Tyrian 2000 tyrian.sav.",
    savesConfirm: "Replace the saved games in this browser with the ones in this file? " +
                  "The current ones are kept as tyrian-before-loading.sav.",
    savesDone: "Done: the saved games were loaded.", savesRestart: "Done. Opening the game again...",
    savesFailed: "That did not work: "
  };
  document.documentElement.lang = pt ? "pt-BR" : "en";

  var overlay = document.getElementById("overlay");
  var status = document.getElementById("status");
  var play = document.getElementById("play");
  var full = document.getElementById("full");
  var canvas = document.getElementById("canvas");
  play.textContent = T.play;
  full.textContent = T.full;
  document.getElementById("hint").textContent = T.hint;
  ["savesLink", "savesTitle", "savesText", "savesExport", "savesImport", "savesClose", "savesHelp"].forEach(function (id) {
    document.getElementById(id).textContent = T[id];
  });
  status.textContent = T.loading;

  // The game's user folder (see determineUserDirPath in src/file.c), kept in
  // IndexedDB, and the game's own folder inside it.
  var USER_DIR = "/home/web_user/.config";
  var GAME_DIR = USER_DIR + "/tyrian2000plus";
  var syncing = false, syncAgain = false, syncTimer = 0;

  function fail(message) {
    status.textContent = T.error + message;
    overlay.classList.remove("ready");
    overlay.style.display = "";
  }

  function syncSaves() {
    if (syncing) { syncAgain = true; return; }
    syncing = true;
    Module.FS.syncfs(false, function (err) {
      syncing = false;
      if (err) console.warn("saving to IndexedDB failed", err);
      if (syncAgain) { syncAgain = false; syncSaves(); }
    });
  }
  function syncSoon() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncSaves, 500);
  }

  function loadSaves() {
    var FS = Module.FS;
    FS.mkdirTree(USER_DIR);
    FS.mount(Module.IDBFS, {}, USER_DIR);
    Module.addRunDependency("saves");
    FS.syncfs(true, function (err) {
      if (err) console.warn("reading from IndexedDB failed", err);
      Module.removeRunDependency("saves");
    });
    // Any file the game writes or closes in its folder is copied back soon.
    var close = FS.close;
    FS.close = function (stream) {
      var r = close.apply(this, arguments);
      if (stream && stream.path && stream.path.indexOf(USER_DIR) === 0 && (stream.flags & 3) !== 0)
        syncSoon();
      return r;
    };
  }

  // data/tyrian2000.tar: the original data files, unchanged, in a plain
  // (ustar) tar; see make_web.sh.
  function untar(buf) {
    var bytes = new Uint8Array(buf), files = [];
    function text(at, len) {
      var s = "";
      for (var i = at; i < at + len && bytes[i]; ++i) s += String.fromCharCode(bytes[i]);
      return s;
    }
    for (var at = 0; at + 512 <= bytes.length && bytes[at]; ) {
      var name = text(at, 100).replace(/^\.\//, "");
      var size = parseInt(text(at + 124, 12).trim(), 8) || 0;
      var type = text(at + 156, 1);
      if ((type === "0" || type === "") && name)
        files.push({ name: name, data: bytes.subarray(at + 512, at + 512 + size) });
      at += 512 + Math.ceil(size / 512) * 512;
    }
    return files;
  }

  function loadData() {
    Module.addRunDependency("data");
    status.textContent = T.data;
    fetch("data/tyrian2000.tar").then(function (r) {
      if (!r.ok) throw new Error(T.nodata);
      var total = +r.headers.get("Content-Length") || 0;
      if (!r.body || !total) return r.arrayBuffer();
      // with a progress figure while it downloads
      var reader = r.body.getReader(), chunks = [], got = 0;
      return (function pump() {
        return reader.read().then(function (part) {
          if (part.done) {
            var all = new Uint8Array(got), at = 0;
            chunks.forEach(function (c) { all.set(c, at); at += c.length; });
            return all.buffer;
          }
          chunks.push(part.value);
          got += part.value.length;
          status.textContent = T.data + Math.min(100, Math.round(got * 100 / total)) + "%";
          return pump();
        });
      })();
    }).then(function (buf) {
      var files = untar(buf);
      if (!files.length) throw new Error(T.nodata);
      Module.FS.mkdirTree("/data");
      files.forEach(function (f) { Module.FS.writeFile("/data/" + f.name, f.data); });
      Module.removeRunDependency("data");
    }).catch(function (e) {
      fail(e.message);
    });
  }

  // ---- saved games: tyrian.sav to and from the computer ----
  var saves = document.getElementById("saves");
  var savesMsg = document.getElementById("savesMsg");
  var savesFile = document.getElementById("savesFile");
  var running = false;
  // tyrian.sav: 22 save slots (2502 bytes), then Tyrian 2000's high scores (2220)
  var SAV_MIN = 2502, SAV_MAX = 2502 + 2220;

  function readSav(name) {
    try { return Module.FS.readFile(GAME_DIR + "/" + name); } catch (e) { return null; }
  }

  function openSaves() {
    savesMsg.textContent = "";
    saves.classList.add("open");
    document.getElementById("savesExport").focus();
  }
  function closeSaves() {
    saves.classList.remove("open");
    (running ? canvas : play).focus();
  }

  function exportSav() {
    var data = readSav("tyrian.sav");
    if (!data) { savesMsg.textContent = T.savesNone; return; }
    var url = URL.createObjectURL(new Blob([data], { type: "application/octet-stream" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = "tyrian.sav";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  function importSav(file) {
    if (!file) return;
    file.arrayBuffer().then(function (buf) {
      var data = new Uint8Array(buf);
      if (data.length < SAV_MIN || data.length > SAV_MAX) { savesMsg.textContent = T.savesBad; return; }
      if (!confirm(T.savesConfirm)) return;
      var FS = Module.FS;
      FS.mkdirTree(GAME_DIR);
      var old = readSav("tyrian.sav");
      if (old) FS.writeFile(GAME_DIR + "/" + (pt ? "tyrian-antes-de-carregar.sav" : "tyrian-before-loading.sav"), old);
      FS.writeFile(GAME_DIR + "/tyrian.sav", data);
      // The running game keeps its saves in memory: open it again, so it
      // reads the new file (and cannot write the old ones over it).
      savesMsg.textContent = running ? T.savesRestart : T.savesDone;
      FS.syncfs(false, function (err) {
        if (err) { savesMsg.textContent = T.savesFailed + err; return; }
        if (running) location.reload();
      });
    }).catch(function (e) {
      savesMsg.textContent = T.savesFailed + e.message;
    });
  }

  document.getElementById("savesLink").addEventListener("click", function (e) {
    e.stopPropagation();  // not a click on the overlay (that starts the game)
    openSaves();
  });
  document.getElementById("savesExport").addEventListener("click", exportSav);
  document.getElementById("savesImport").addEventListener("click", function () { savesFile.click(); });
  document.getElementById("savesClose").addEventListener("click", closeSaves);
  savesFile.addEventListener("change", function () {
    importSav(savesFile.files[0]);
    savesFile.value = "";
  });
  saves.addEventListener("click", function (e) { if (e.target === saves) closeSaves(); });
  // the game's Setup > Saved Games
  window.tyrianSaves = { open: openSaves };

  // ---- What's New: the notes of each release, from GitHub ----
  // The game itself does not ask GitHub in the browser (no threads, and this
  // page is always the newest version on itch.io), so the page asks, and
  // writes release-notes.txt in the game's folder the way src/update_check.c
  // does: an "@@ tag date" line, then the notes (the English and Portuguese
  // parts), before the game starts.  Without internet the file from the last
  // visit stays.
  var releaseNotes = null;
  fetch("https://api.github.com/repos/gabrielbadolato/tyrian2000plus/releases?per_page=10", {
    headers: { "Accept": "application/vnd.github+json" }
  }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (list) {
    var text = "# Release notes of Tyrian 2000+, from GitHub, for the What's New screen.\n";
    list.forEach(function (rel) {
      if (rel.draft || rel.prerelease || !/^v\d/.test(rel.tag_name || "")) return;
      text += "@@ " + rel.tag_name + " " + (rel.published_at || "").slice(0, 10) + "\n";
      (rel.body || "").split(/\r?\n/).forEach(function (line) {
        text += (line.indexOf("@@") === 0 ? " " : "") + line + "\n";
      });
    });
    releaseNotes = text;
    writeReleaseNotes();
  }).catch(function (e) {
    console.log("release notes not fetched", e);
  });

  function writeReleaseNotes() {
    // only once the saves are mounted (preRun) and before the game reads it
    if (!releaseNotes || !Module.FS || !overlay.classList.contains("ready")) return;
    try {
      Module.FS.mkdirTree(GAME_DIR);
      Module.FS.writeFile(GAME_DIR + "/release-notes.txt", releaseNotes);
      releaseNotes = null;
      syncSoon();
    } catch (e) {
      console.log("release notes not written", e);
    }
  }

  function start() {
    if (!overlay.classList.contains("ready")) return;
    writeReleaseNotes();
    overlay.style.display = "none";
    running = true;
    document.body.classList.add("playing");
    canvas.focus();
    // The level in progress is recorded as it is played (lastlevel.rec, for
    // Continue): copy what changed every few seconds, in case the tab is
    // closed in the middle of a level.
    setInterval(syncSaves, 5000);
    try { Module.callMain([]); } catch (e) { if (e !== "unwind" && !(e && e.name === "ExitStatus")) throw e; }
  }

  function fullscreen() {
    var el = document.documentElement;
    var p = el.requestFullscreen ? el.requestFullscreen() : null;
    // In full screen Esc would leave it instead of reaching the game (its
    // pause key); Chrome and Edge can keep Esc for the page.
    if (p && navigator.keyboard && navigator.keyboard.lock)
      p.then(function () { navigator.keyboard.lock(["Escape"]).catch(function () {}); }).catch(function () {});
    canvas.focus();
  }
  full.addEventListener("click", fullscreen);

  // ---- The mouse during a level ----
  // The ship follows the mouse's movement, which stops once the pointer
  // reaches the edge of the page, unless the page holds a pointer lock.  The
  // game asks for it during a level (mouseSetRelative in src/keyboard.c);
  // the browser gives it only at a click or key press, so take it then, when
  // the mouse is in use (keyboard and touch players keep their pointer).
  // While locked the browser keeps Esc for itself (it releases the lock), so
  // losing the lock in a level is the player's Esc: pass it to the game, which
  // pauses with the first press.
  var lockWanted = false, lockReleasing = false;
  var mouseMovedAt = -1e9, escapeAt = -1e9;
  function mouseLocked() { return document.pointerLockElement === canvas; }
  window.tyrianMouseLock = function (on) {
    lockWanted = !!on;
    if (!lockWanted && mouseLocked()) {
      lockReleasing = true;
      document.exitPointerLock();
    }
    // A level started or resumed with a click or a key a moment ago still
    // counts as one, so a mouse player is not left without it; not after
    // Esc, which the browser would take back along with the lock.
    if (lockWanted && performance.now() - mouseMovedAt < 30000 &&
        performance.now() - escapeAt > 1500 &&
        (!navigator.userActivation || navigator.userActivation.isActive))
      takeMouseLock();
  };
  function takeMouseLock() {
    if (!lockWanted || mouseLocked() || !running || saves.classList.contains("open")) return;
    try {
      var p = canvas.requestPointerLock();
      if (p && p.catch) p.catch(function () {});  // refused: again at the next click or key
    } catch (e) {}
  }
  canvas.addEventListener("pointermove", function (e) {
    if (e.pointerType === "mouse") mouseMovedAt = performance.now();
  });
  canvas.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse") takeMouseLock();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") escapeAt = performance.now();
    else if (performance.now() - mouseMovedAt < 5000) takeMouseLock();
  }, true);
  document.addEventListener("pointerlockchange", function () {
    if (mouseLocked()) return;
    var released = lockReleasing;
    lockReleasing = false;
    // not when the game let it go, nor when the player left the tab or the
    // window, nor when the Esc itself reached the game
    if (released || !lockWanted || document.hidden || !document.hasFocus() ||
        performance.now() - escapeAt < 500)
      return;
    // (a keyup first: the browser may have kept the one of an earlier Esc,
    // and the game would take this one for the same key still held)
    ["keyup", "keydown", "keyup"].forEach(function (type) {
      var e = new KeyboardEvent(type, { key: "Escape", code: "Escape", bubbles: true, cancelable: true });
      Object.defineProperty(e, "keyCode", { value: 27 });
      Object.defineProperty(e, "which", { value: 27 });
      window.dispatchEvent(e);
    });
  });

  overlay.addEventListener("click", start);
  document.addEventListener("keydown", function (e) {
    if (saves.classList.contains("open")) {
      // the window's own keys, not the game's
      e.stopPropagation();
      if (e.key === "Escape") { e.preventDefault(); closeSaves(); }
      return;
    }
    if (overlay.style.display !== "none" && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      start();
    }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && Module.FS) syncSaves();
  });
  // Closing the tab right after saving: the copy to IndexedDB waits 0.5 s
  // (syncSoon), so it is started at once here.
  window.addEventListener("pagehide", function () {
    if (Module.FS) { clearTimeout(syncTimer); syncSaves(); }
  });

  window.Module = {
    canvas: canvas,
    preRun: [loadSaves, loadData],
    onRuntimeInitialized: function () {
      status.textContent = "";
      overlay.classList.add("ready");
      play.focus();
      writeReleaseNotes();
    },
    onExit: function () {
      syncSaves();
      document.body.classList.remove("playing");
      if (document.fullscreenElement) document.exitFullscreen();
      status.textContent = T.closed;
      play.textContent = T.again;
      overlay.classList.remove("ready");
      overlay.style.display = "";
      overlay.onclick = function () { location.reload(); };
      play.style.display = "inline-block";
    },
    printErr: function (text) { console.warn(text); },
    print: function (text) { console.log(text); }
  };
  window.addEventListener("error", function (e) {
    if (overlay.style.display !== "none" && !overlay.classList.contains("ready")) fail(e.message);
  });
})();
</script>
<script src="tyrian.js"></script>
</body>
</html>
